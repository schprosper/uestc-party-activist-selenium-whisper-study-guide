name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Demonstrate offline behavior
        run: python examples/offline_demo.py --json
      - name: Run unit and hidden GUI tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
