name: Release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release zips
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $lightZip = "dxpx-light-study-srt-$version.zip"
          $srtZip = "srt-only-$version.zip"

          $srtCount = (Get-ChildItem -Recurse -File .\srt -Filter *.srt).Count
          if ($srtCount -ne 131) {
            throw "Expected 131 SRT files, found $srtCount."
          }

          git archive --format=zip --output=$lightZip HEAD -- .gitattributes .gitignore README.md go.ps1 "开始使用.bat" setup.ps1 config.example.ps1 scripts vendor srt assets docs
          if ($LASTEXITCODE -ne 0) {
            throw "git archive failed for $lightZip."
          }

          git archive --format=zip --output=$srtZip HEAD -- srt
          if ($LASTEXITCODE -ne 0) {
            throw "git archive failed for $srtZip."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($zipPath in @($lightZip, $srtZip)) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
            try {
              $bad = $zip.Entries | Where-Object { $_.FullName -match '(\.venv|config\.local|__pycache__|chrome-profile|\.git[\\/])' }
              if ($bad) {
                throw "Unexpected runtime/private file in $zipPath: $($bad[0].FullName)"
              }
            }
            finally {
              $zip.Dispose()
            }
          }

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME
          $lightZip = "dxpx-light-study-srt-$version.zip"
          $srtZip = "srt-only-$version.zip"
          $notes = @"
          Light Windows launcher for DXPX auto study.

          Assets:
          - $lightZip: light auto-study scripts, GUI launcher, 131 SRT files, and offline Selenium wheels.
          - $srtZip: only the final curated SRT files.
          "@

          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version $lightZip $srtZip --clobber
          }
          else {
            gh release create $version $lightZip $srtZip --title "$version light study + SRT" --notes $notes
          }
